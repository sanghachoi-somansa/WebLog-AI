# Docker Compose + Caddy (Streamlit 앞단 프록시)
#
# 준비: 서버에 Docker / Compose Plugin 설치 후 프로젝트 루트에서
#   cp .env.example .env   # 필수: compose 가 .env 를 읽음(비워 두어도 됨)
#   docker compose up -d --build
#
# 접속: http://서버공인IP/  (또는 DNS가 가리키는 도메인)
#
# HTTPS(도메인): Caddyfile.https.example 참고해 도메인 블록으로 Caddyfile 교체 후
#   docker compose restart caddy
#
# 다른 Caddy 설정 파일을 쓰려면 (PowerShell 예):
#   $env:CADDYFILE = "Caddyfile.https.example"
#   docker compose up -d
#
# Docker Hub 타임아웃 / TLS 문제 시:
#   - Somansa NLAB: `curl http://rocky.mirror.lab.somansa.com/cert.sh | sudo bash -`
#     및 `curl http://rocky.mirror.lab.somansa.com/docker.sh | sudo bash -`
#   - 이미지는 Hub 경로 앞에 미러 붙임 (NLAB 문서): docker.lab.somansa.com/<이미지>
#   - 기본값은 사내 미러를 쓰도록 설정됨. Docker Hub 직접 쓸 때는 `.env` 에:
#       CADDY_IMAGE=caddy:2-alpine
#       PYTHON_BASE=python:3.12-slim-bookworm
#   - 첫 pull 지연 시 10~15분 후 재시도 (NLAB 캐싱 미러 안내)

services:
  app:
    build:
      context: .
      args:
        PYTHON_BASE: ${PYTHON_BASE:-docker.lab.somansa.com/python:3.12-slim-bookworm}
    env_file:
      - .env
    expose:
      - "8501"
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-docker.lab.somansa.com/caddy:2-alpine}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
